<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-labelledby="t d">
  <title id="t">PASVL / LOSDA framework mark</title>
  <desc id="d">An open brace enclosing a keyhole, inside a shield: the source is open, the permission is recorded.</desc>

  <defs>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#006a4e"/>
      <stop offset="100%" stop-color="#00432f"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f42a41"/>
      <stop offset="100%" stop-color="#b81d2e"/>
    </linearGradient>
  </defs>

  <!-- shield -->
  <path d="M120 12 L212 48 V120 C212 172 174 210 120 228 C66 210 28 172 28 120 V48 Z"
        fill="url(#shield)" stroke="#00301f" stroke-width="3"/>

  <!-- open brace: the source is open -->
  <path d="M96 66 C78 66 78 84 78 96 C78 108 68 112 62 120 C68 128 78 132 78 144 C78 156 78 174 96 174"
        fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
  <path d="M144 66 C162 66 162 84 162 96 C162 108 172 112 178 120 C172 128 162 132 162 144 C162 156 162 174 144 174"
        fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>

  <!-- keyhole: deployment is licensed -->
  <circle cx="120" cy="106" r="15" fill="url(#key)"/>
  <path d="M113 118 L127 118 L131 162 L109 162 Z" fill="url(#key)"/>

  <!-- base line -->
  <rect x="70" y="188" width="100" height="4" rx="2" fill="#ffffff" opacity="0.35"/>
</svg>
