# Continuous integration for the framework repository.
#
# Licensed under PASVL-1.0. Source is public. Deployment requires a LOSDA.
# Note: running this workflow is permitted by PASVL Article 3 (verification), not a
# deployment of the software.

name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate documents and records
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test runner
        run: python -m pip install --upgrade pytest

      - name: Run validator tests
        run: python -m pytest scripts/tests -q

      - name: Validate the registry
        run: python scripts/validate_registry.py

      - name: Validate example records
        run: |
          for file in examples/*.json; do
            echo "checking $file"
            python scripts/validate_losda.py "$file" --single || exit 1
          done

      - name: Verify the example record hash
        run: |
          python scripts/hash_record.py examples/losda-record.json || true

      - name: Check JSON schemas parse
        run: |
          python - <<'PY'
          import json, pathlib
          for path in pathlib.Path("schemas").glob("*.json"):
              json.loads(path.read_text())
              print(f"ok {path}")
          PY

  licence-headers:
    name: Check licence headers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check headers on scripts
        run: python scripts/check_license_headers.py --path scripts

  links:
    name: Check links in documentation
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: "yes"
          config-file: ".github/markdown-link-check.json"

  spelling:
    name: Spellcheck
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run codespell
        uses: codespell-project/actions-codespell@v2
        with:
          skip: "*.json,*.svg,.git"
          ignore_words_list: "LOSDA,PASVL,BSDC,licence,licenced,licences,organisational,authorisation,authorised,organisation,utilise,behaviour,judgement,programme,recognise,recognised,summarise,minimisation,sanctioned,analysed,prioritise,favour,labelled,modelling,cancelled,fulfil,fulfilment,enrolment,defence,offence,practise"
