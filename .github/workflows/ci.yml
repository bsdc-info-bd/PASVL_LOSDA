# Continuous integration for the framework repository.
#
# Licensed under PASVL-1.0. Source is public. Deployment requires a LOSDA.
# Running this workflow is permitted by PASVL Article 3 (verification); it is not a
# deployment of the software.
#
# Design notes:
#   * Every gate is deterministic and runs offline. Flaky network checks are advisory only.
#   * Third-party actions are pinned to major versions on a supported Node runtime.
#   * The checks are the same scripts a contributor runs locally, so CI cannot surprise them.

name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate documents and records
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install --upgrade pytest

      - name: Run validator tests
        run: python -m pytest scripts/tests -q

      - name: Validate the registry
        run: python scripts/validate_registry.py

      - name: Validate example records
        run: |
          set -e
          for file in examples/*.json; do
            echo "checking $file"
            python scripts/validate_losda.py "$file" --single
          done

      - name: Check that every JSON file parses
        run: |
          python - <<'PY'
          import json, pathlib
          count = 0
          for path in sorted(pathlib.Path(".").rglob("*.json")):
              json.loads(path.read_text(encoding="utf-8"))
              count += 1
          print(f"{count} JSON files parse")
          PY

  spelling:
    name: Spellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install codespell
        run: python -m pip install --upgrade codespell

      - name: Spellcheck
        # Configuration and justified legal-term exemptions live in .codespellrc.
        run: codespell

  prose:
    name: Prose and Markdown lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check spelling consistency, doubled words, articles, and delimiters
        run: python scripts/check_docs.py

      - name: Check internal links and anchors
        run: python scripts/check_links.py

      - name: Check that every section reference resolves
        run: python scripts/check_refs.py

  license-headers:
    name: Check license headers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check headers on scripts
        run: python scripts/check_license_headers.py --path scripts

  external-links:
    name: External links (advisory)
    runs-on: ubuntu-latest
    # Advisory: third-party hosts rate-limit and occasionally go down. A dead link is
    # reported for a maintainer to fix, but it must not block a legal-text change.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check external URLs
        run: python scripts/check_links.py --external || true
